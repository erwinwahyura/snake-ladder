# Ships the single binary, a systemd unit and a Caddy site block.
# Run from the repo root: make deploy
- hosts: game
  become: true
  vars:
    domain: ulartangga.erwarx.com
    port: 8090 # must match ADDR in deploy/snake-ladder.service
    # A restart ends every game in progress, so wait for them to finish
    # first (healthz "playing" == 0), but never longer than this.
    drain_minutes: 10
  tasks:
    - name: See whether the game server is already running
      ansible.builtin.service_facts:

    - name: Wait for games in progress to finish (up to {{ drain_minutes }} minutes)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ port }}/healthz"
        return_content: true
      register: health
      until: health.json is defined and health.json.playing == 0
      retries: "{{ (drain_minutes | int) * 6 }}"
      delay: 10
      failed_when: false
      when: >-
        'snake-ladder.service' in ansible_facts.services and
        ansible_facts.services['snake-ladder.service'].state == 'running'

    - name: Say so if games were still running when we gave up waiting
      ansible.builtin.debug:
        msg: "Still {{ health.json.playing }} game(s) running; deploying anyway. Players see 'server sedang diperbarui'."
      when: health.json is defined and (health.json.playing | int) > 0

    - name: Service user
      ansible.builtin.user:
        name: snakeladder
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Binary
      ansible.builtin.copy:
        src: ../../bin/snake-ladder-linux-amd64
        dest: /usr/local/bin/snake-ladder
        mode: "0755"
      notify: restart snake-ladder

    - name: systemd unit
      ansible.builtin.copy:
        src: ../snake-ladder.service
        dest: /etc/systemd/system/snake-ladder.service
        mode: "0644"
      notify: restart snake-ladder

    - name: Caddy site
      ansible.builtin.copy:
        dest: /etc/caddy/sites/snake-ladder.caddy
        content: |
          {{ domain }} {
          	encode zstd gzip
          	reverse_proxy 127.0.0.1:{{ port }}
          }
        mode: "0644"
      notify: reload caddy

    - name: Service running
      ansible.builtin.systemd:
        name: snake-ladder
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: restart snake-ladder
      ansible.builtin.systemd:
        name: snake-ladder
        state: restarted
        daemon_reload: true
    - name: reload caddy
      ansible.builtin.systemd:
        name: caddy
        state: reloaded
