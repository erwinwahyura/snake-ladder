# Ships the single binary, a systemd unit and a Caddy site block.
# Run from the repo root: make deploy
- hosts: game
  become: true
  vars:
    domain: ulartangga.erwarx.com
  tasks:
    - name: Service user
      ansible.builtin.user:
        name: snakeladder
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Binary
      ansible.builtin.copy:
        src: ../../bin/snake-ladder-linux-amd64
        dest: /usr/local/bin/snake-ladder
        mode: "0755"
      notify: restart snake-ladder

    - name: systemd unit
      ansible.builtin.copy:
        src: ../snake-ladder.service
        dest: /etc/systemd/system/snake-ladder.service
        mode: "0644"
      notify: restart snake-ladder

    - name: Caddy site
      ansible.builtin.copy:
        dest: /etc/caddy/sites/snake-ladder.caddy
        content: |
          {{ domain }} {
          	encode zstd gzip
          	reverse_proxy 127.0.0.1:8090
          }
        mode: "0644"
      notify: reload caddy

    - name: Service running
      ansible.builtin.systemd:
        name: snake-ladder
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: restart snake-ladder
      ansible.builtin.systemd:
        name: snake-ladder
        state: restarted
        daemon_reload: true
    - name: reload caddy
      ansible.builtin.systemd:
        name: caddy
        state: reloaded
